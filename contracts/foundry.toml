[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ignored_warnings_from = ["lib/"]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
galileo = "https://evmrpc-testnet.0g.ai"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
